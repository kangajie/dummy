  <style>
    :root {
      --bg: #f4faf6; --surface: #ffffff; --ink: #10261a; --muted: #587062; --line: #d3e5d9;
      --red: #c8372f; --g500: #2e9d5a; --g600: #228049; --g900: #0d3b22;
      --font-d: 'Bricolage Grotesque', sans-serif;
      --font-b: 'Figtree', sans-serif;
    }
    body {
      margin: 0; padding: 0; background: linear-gradient(135deg, var(--bg) 0%, #e0f0e6 100%);
      font-family: var(--font-b); display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: var(--surface); padding: 36px 32px; border-radius: 24px;
      box-shadow: 0 16px 48px rgba(13,59,34,0.12); width: 100%; max-width: 360px; text-align: center;
      border: 1px solid #fff; box-sizing: border-box; margin: 16px;
    }
    .logo {
      width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 50%;
      background: url('../assets/image/logo-itech.jpg') center/cover;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15); border: 3px solid #fff;
    }
    h2 { margin: 0 0 8px; color: var(--g900); font-family: var(--font-d); font-size: 26px; letter-spacing: -0.5px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
    
    .field { text-align: left; margin-bottom: 16px; position: relative; }
    .field label {
      font-size: 13.5px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 8px;
    }
    .txt {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px;
      font-size: 15px; box-sizing: border-box; font-family: inherit; background: #fafdfb;
      transition: all 0.2s; color: var(--ink);
    }
    .txt:focus {
      outline: none; border-color: var(--g500); background: #fff; box-shadow: 0 0 0 4px var(--line);
    }
    .txt::placeholder { color: #9ab3a3; }
    
    .btn {
      background: var(--g500); color: #fff; border: none; padding: 14px; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; font-family: inherit;
      transition: all 0.2s; box-shadow: 0 4px 12px rgba(46,157,90,0.3); margin-top: 8px;
    }
    .btn:hover { background: var(--g600); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(46,157,90,0.4); }
    .btn:active { transform: translateY(1px); box-shadow: 0 2px 8px rgba(46,157,90,0.3); }
    
    #lErr { color: var(--red); font-size: 13.5px; font-weight: 600; margin: 16px 0 0; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h2>SmartAgro</h2>
    <p class="sub">Autentikasi panel operator</p>
    
    <div class="field">
      <label>Username</label>
      <input type="text" id="lUser" class="txt" placeholder="Masukkan username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="lPass" class="txt" placeholder="Masukkan password">
    </div>
    
    <button id="btnLogin" class="btn">Login Dashboard</button>
    <p id="lErr"></p>
  </div>

  <script>
    const btn = document.getElementById('btnLogin');
    const u = document.getElementById('lUser');
    const p = document.getElementById('lPass');
    const err = document.getElementById('lErr');

    btn.addEventListener('click', () => {
      if(u.value === 'admin' && p.value === 'admin1234'){
        sessionStorage.setItem('auth', 'true');
        window.location.replace('../index.html');
      } else {
        err.textContent = 'Username atau password salah!';
      }
    });
    p.addEventListener('keydown', e => { if(e.key === 'Enter') btn.click() });
    u.addEventListener('keydown', e => { if(e.key === 'Enter') p.focus() });
  </script>
</body>
</html>
